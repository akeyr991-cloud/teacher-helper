<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Change Password - Teacher Helper</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Teacher Helper
        </div>

        <button
            id="menuButton"
            class="menu-button"
            type="button"
        >
            ☰
        </button>

        <nav
            id="mobileMenu"
            class="nav-menu"
        >

            <a href="teacher-dashboard.html">
                Dashboard
            </a>

            <a href="teacher-register.html">
                Register Student
            </a>

            <a href="change-password.html">
                Change Password
            </a>

            <button
                id="logoutButton"
                class="logout-button"
                type="button"
            >
                Logout
            </button>

        </nav>

    </header>


    <main class="auth-container">

        <div class="form-card">

            <h1>
                Change Password
            </h1>

            <p class="form-description">
                Update your teacher account password.
            </p>


            <form id="changePasswordForm">

                <label for="currentPassword">
                    Current Password
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    name="currentPassword"
                    autocomplete="current-password"
                    placeholder="Enter current password"
                    required
                >


                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    autocomplete="new-password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >


                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    autocomplete="new-password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="button"
                >
                    Change Password
                </button>


                <p
                    id="passwordMessage"
                    class="message"
                ></p>

            </form>

        </div>

    </main>


    <script src="javascript.js"></script>

</body>
</html>
